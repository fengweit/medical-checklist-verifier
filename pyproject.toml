[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medical-checklist-verifier"
version = "0.1.0"
description = "Provenance-first medical checklist digestion and verification tools"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
  "docling>=2.119,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "PyMuPDF>=1.24,<2",
  "pytest>=8,<9",
  "python-docx>=1.1,<2",
]

[project.scripts]
checklist-digester = "medical_checklist_verifier.checklist_digester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_checklist_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:builtin type Swig.*:DeprecationWarning",
  "ignore:This field is deprecated.*:DeprecationWarning",
  "ignore:deprecated:DeprecationWarning",
  "ignore:`torch.jit.script_method` is deprecated.*:DeprecationWarning",
  "ignore:invalid escape sequence.*:SyntaxWarning",
]
